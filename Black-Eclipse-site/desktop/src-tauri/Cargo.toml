[package]
name = "black-eclipse-desktop"
version = "0.1.0"
description = "Black Eclipse native shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unix process-group control: killing the bootstrap must also kill the Next
# server and the Python harness it spawned. `taskkill /T` does that on Windows;
# on Unix the child is started in its own session and the group is signalled.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
# Failed-navigation interception. WebView2 renders its own (Edge/Bing branded)
# error page when a navigation fails, and the shell then owns no document to
# style. `NavigationCompleted` is the only WebView2 signal that reports the
# failure, so the shell navigates back to the bundled splash instead.
# Same version Tauri already resolves (see Cargo.lock) — no upgrade.
webview2-com = "0.39"
# BOOL/PWSTR for the two values the NavigationCompleted args expose. Same
# windows-core Tauri resolves, so no second COM stack is linked.
windows-core = "0.62"

# The shell is a thin Tauri wrapper, so its build time matters far more than a
# few megabytes: `lto = true` + `codegen-units = 1` is the slowest configuration
# Rust offers (the final binary is emitted and linked single-threaded), and it
# was rebuilt on every release. Thin LTO with the default parallel codegen units
# keeps the stripped binary the same order of size while letting 12 cores do the
# work — a rebuild drops from tens of minutes to a couple.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
