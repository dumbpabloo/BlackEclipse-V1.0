name: Desktop release

# Builds the desktop app for Windows, macOS and Linux from one tag.
#
# Each platform's bundle MUST be produced on that platform: Python wheels, the
# Node binary and the OS webview are all per-target, so cross-compiling the
# payload is not possible. The matrix exists for exactly that reason.
#
# Notarisation (phase C5) is present as a gated skeleton. It stays off until the
# repository has Apple secrets; an unsigned macOS build is still produced.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload to a GitHub Release (otherwise artifacts only)"
        type: boolean
        default: false
      tag:
        description: "Release tag to build and publish, e.g. v0.4.16. Required when upload_release is true (a dispatch otherwise builds the branch)."
        type: string
        default: ""
      only:
        description: "Build one OS (windows-latest | ubuntu-latest | macos-latest). Blank = Windows only, same as a tag push."
        type: string
        default: ""
      offline_installer:
        description: "Also build the offline (-full) Windows installer. Tag pushes always build it."
        type: boolean
        default: false
      smoke_tests:
        description: "Run the post-build smoke test. Tag pushes always run it."
        type: boolean
        default: true
      publish:
        description: "Publish the release immediately instead of creating a draft. Upload stable.json right after."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The Next standalone payload is platform-independent JS. Build it ONCE here
  # and hand it to the package jobs: that removes the Windows/macOS payload
  # builds entirely (the 16 GB Windows runner ran out of heap on them for
  # v0.4.9–v0.4.11) and saves two full compiles per release.
  payload:
    name: build payload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A dispatch builds the branch unless a tag is named. A release must be
          # built from exactly the commit the signed update manifest points at.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Black-Eclipse-site/package-lock.json

      - name: Cache the Next build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Black-Eclipse-site/.next/cache
          key: next-payload-${{ hashFiles('Black-Eclipse-site/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-payload-${{ hashFiles('Black-Eclipse-site/package-lock.json') }}-
            next-payload-

      - name: Install dependencies
        working-directory: Black-Eclipse-site
        shell: bash
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npx prisma generate

      - name: Build the standalone payload
        working-directory: Black-Eclipse-site
        shell: bash
        run: npm run desktop:payload

      - name: Upload the payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-payload
          # webpack's build cache is an input, not product: shipping it would
          # add hundreds of MB to every download for no benefit.
          # .next-desktop starts with a dot: upload-artifact v4 skips hidden
          # paths by default, so without this the payload silently uploads
          # NOTHING and the job dies with "No files were found".
          include-hidden-files: true
          path: |
            Black-Eclipse-site/.next-desktop
            !Black-Eclipse-site/.next-desktop/cache
          if-no-files-found: error

  # The artifact the UPDATER ships: the compiled production `.next` for this
  # tag. The client downloads it, verifies the signed sha256/size, and promotes
  # it — no git checkout and no compile on the user's machine. Without it the
  # updater falls back to checkout+build, which a dirty tree (any release that
  # touches the changelog) blocks.
  #
  # Deliberately separate from `payload`: that one is a Next standalone bundle
  # for the installers, this one is the plain build the desktop serves. Two
  # compiles per release buys the update path; the npm cache keeps it cheap.
  release-build:
    name: release build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Black-Eclipse-site/package-lock.json

      - name: Install dependencies
        working-directory: Black-Eclipse-site
        shell: bash
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npx prisma generate

      - name: Build and zip the release build
        working-directory: Black-Eclipse-site
        shell: bash
        run: npm run release:build

      - name: Upload the release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: Black-Eclipse-site/dist/BlackEclipse-Build-*.zip
          if-no-files-found: error

  build:
    name: build (${{ matrix.os }})
    needs: payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # NOTE: the one-OS fast lane cannot be a job-level `if:`. That expression is
    # evaluated BEFORE the matrix expands, so `matrix.os` is not a valid context
    # there and GitHub refuses to parse the entire workflow:
    #   "failed to parse workflow (Line: 90, Col: 9): Unrecognized named-value:
    #    'matrix'" — which failed every run in 0 s with no jobs at all.
    # Filter inside `strategy.matrix` instead, or gate the steps.
    # No Next build runs in these jobs any more: the shared `payload` job owns
    # it. That is what removes the Windows runner's out-of-memory failure
    # (v0.4.9–v0.4.11) and two full compiles per release.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The packaged agent runtime may be cold on a runner (a first import of
      # the whole harness). Its own start budget defaults to 300 s; give CI
      # double that, and let the smoke wait long enough to observe it.
      HARNESS_PY_START_TIMEOUT_MS: "600000"
      BE_SMOKE_HARNESS_MS: "420000"
    strategy:
      fail-fast: false
      # The matrix has to be filtered HERE, before it expands: a job-level `if`
      # cannot see `matrix` (see the note above), and an `include` entry for a
      # filtered-out OS would add that OS back.
      #
      #   workflow_dispatch with `only`  -> exactly that OS
      #   tag push                      -> Windows only
      #   workflow_dispatch, no `only`  -> Windows only (never all three by
      #                                    accident: a backfill must name its OS)
      #
      # Windows-first is deliberate: Windows is where the installed user base
      # is, and a fix's draft release is ready in ~15 minutes instead of waiting
      # for the slowest runner. macOS and Linux attach to the same release from a
      # manual run that passes `only` (see docs/UPDATES.md, "Windows-first tags").
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.only != '') && format('["{0}"]', inputs.only) || '["windows-latest"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A dispatch builds the branch unless a tag is named. A release must be
          # built from exactly the commit the signed update manifest points at.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Black-Eclipse-site/package-lock.json

      # Pinned, not floating `stable`: a toolchain bump silently invalidates
      # every Rust fingerprint in the cached target dir, so a release with no
      # Rust change pays for a cold rebuild. Bump deliberately (Cargo.toml's
      # rust-version is the floor).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned
        with:
          toolchain: "1.99.0"

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Black-Eclipse-site/desktop/src-tauri/target
          key: desktop-cargo-${{ matrix.os }}-${{ hashFiles('Black-Eclipse-site/desktop/src-tauri/Cargo.lock') }}
          # A Cargo.lock change used to invalidate the whole target dir, turning
          # every dependency bump into a cold ~15-25 minute Rust build. Restoring
          # the previous target dir lets cargo rebuild only what changed.
          restore-keys: |
            desktop-cargo-${{ matrix.os }}-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        # The hosted runner intermittently cannot resolve archive.ubuntu.com, and
        # a stale mirror can 404 a single package. Retries are cheap; a flaky
        # mirror should not fail the whole matrix.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update -qq && break
            echo "apt update failed (attempt $attempt); retrying"; sleep 10
          done
          for attempt in 1 2 3; do
            sudo -E apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
              libayatana-appindicator3-dev patchelf dpkg xvfb && break
            echo "apt install failed (attempt $attempt); retrying"; sleep 15
          done

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        working-directory: Black-Eclipse-site
        shell: bash
        # postinstall also does global link wiring and git hooks — developer
        # machine concerns that can fail on a clean runner.
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npx prisma generate

      # The vendored interpreter + its dependency stack is the single most
      # expensive non-Rust step (playwright, scikit-learn, xgboost, lightgbm,
      # duckdb, faster-whisper, av...). It only depends on the requirement
      # files and the provisioning scripts, so cache it per OS.
      - name: Restore the vendored Python runtime
        id: py-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Black-Eclipse-site/scripts/vendor/python
          key: vendor-python-${{ runner.os }}-${{ hashFiles('Black-Eclipse-site/python/requirements.txt', 'Black-Eclipse-site/python/analysis-requirements.txt', 'Black-Eclipse-site/scripts/setup-embedded-python.js', 'Black-Eclipse-site/scripts/setup-portable-python.js') }}

      - name: Restore the pip download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/AppData/Local/pip/Cache
          key: pip-${{ runner.os }}-${{ hashFiles('Black-Eclipse-site/python/requirements.txt', 'Black-Eclipse-site/python/analysis-requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Provision Python (windows embed / portable elsewhere)
        working-directory: Black-Eclipse-site
        shell: bash
        # `npm ci --ignore-scripts` skips the postinstall that normally installs
        # the Python requirements, so install them explicitly. Without this the
        # payload has an interpreter but no packages: the app boots and every
        # agent call fails, and the optional packs are empty.
        run: |
          node scripts/setup-embedded-python.js || true
          node scripts/setup-portable-python.js
          node scripts/setup-python.js

      - name: Download the shared payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-payload
          path: Black-Eclipse-site/.next-desktop

      - name: Build the Tauri shell
        working-directory: Black-Eclipse-site
        run: npm run desktop:build

      - name: Assemble the app folder
        working-directory: Black-Eclipse-site
        run: npm run desktop:package

      - name: Verify the payload carries no local configuration
        working-directory: Black-Eclipse-site
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: |
          $app = "dist\BlackEclipse\app"
          $leaks = @(".env", ".env.local", "mcp-servers.json", ".connector-key") |
            Where-Object { Test-Path (Join-Path $app $_) }
          if ($leaks.Count -gt 0) {
            throw "Payload contains local configuration: $($leaks -join ', ')"
          }
          Write-Host "Payload hygiene: clean"

      - name: Build the Windows installers
        if: matrix.os == 'windows-latest'
        working-directory: Black-Eclipse-site
        shell: bash
        run: |
          npm run desktop:installer
          # The offline edition compresses every pack as well (~1 GB), which is
          # the slowest step of the whole job. A tag must ship it; a
          # workflow_dispatch run can skip it while iterating.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.offline_installer }}" = "true" ]; then
            npm run desktop:installer -- --full
          else
            echo "Skipping the offline (-full) installer (offline_installer is false)."
          fi
          # The README's Download button links to this exact name. Fail the
          # build rather than publish a release whose button 404s.
          test -f dist/BlackEclipse-Setup.exe
          echo "stable download alias present: $(ls -lh dist/BlackEclipse-Setup.exe | awk '{print $5}')"

      - name: Build the Linux package
        if: matrix.os == 'ubuntu-latest'
        working-directory: Black-Eclipse-site
        shell: bash
        run: |
          npm run desktop:bundle
          ls -l dist/BlackEclipse-linux-*.deb
          # The README button is pinned to this exact name. If the runner arch
          # ever changes, fail here rather than publish a release whose button
          # 404s - update download-linux.svg and the README link together.
          test -f dist/BlackEclipse-linux-amd64.deb

      - name: Build the macOS app and dmg
        if: matrix.os == 'macos-latest'
        working-directory: Black-Eclipse-site
        shell: bash
        run: |
          npm run desktop:bundle
          ls -l dist/BlackEclipse-mac-*.dmg
          # The README button is pinned to the Apple-silicon name on purpose:
          # an Intel Mac cannot launch an arm64 build, so the choice is explicit.
          test -f dist/BlackEclipse-mac-arm64.dmg

      # --- runtime smoke: a binary that compiles is not an app that runs ------
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.smoke_tests)
        working-directory: Black-Eclipse-site
        shell: bash
        timeout-minutes: 15
        run: node scripts/desktop-smoke.js

      - name: Smoke test (Linux, install the deb on Xvfb)
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || inputs.smoke_tests)
        working-directory: Black-Eclipse-site
        shell: bash
        timeout-minutes: 15
        run: |
          sudo dpkg -i dist/*.deb
          xvfb-run -a node scripts/desktop-smoke.js --bin "/usr/lib/blackeclipse/Black Eclipse"

      # Advisory on macOS: an unsigned app under Gatekeeper can be slow to start
      # its bundled runtime, and a red mac job used to block the Windows and
      # Linux installers from publishing at all. The run still records the
      # failure (and the smoke now prints the runtime's own log lines), but the
      # release can ship the platforms that built and passed.
      - name: Smoke test (macOS)
        if: matrix.os == 'macos-latest' && (github.event_name == 'push' || inputs.smoke_tests)
        working-directory: Black-Eclipse-site
        shell: bash
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/desktop-smoke.js --bin "dist/Black Eclipse.app/Contents/MacOS/black-eclipse-desktop"
      # -----------------------------------------------------------------------

      # --- C5 skeleton -------------------------------------------------------
      # Enable by adding APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD as
      # repository secrets. Without them this step is skipped and the .dmg stays
      # ad-hoc signed, which Gatekeeper blocks for downloaded files.
      - name: Notarise the macOS app (C5, opt-in)
        if: matrix.os == 'macos-latest' && env.APPLE_ID != ''
        working-directory: Black-Eclipse-site
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg | head -n1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
      # -----------------------------------------------------------------------

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: black-eclipse-${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}
          path: |
            Black-Eclipse-site/dist/BlackEclipse-Setup.exe
            Black-Eclipse-site/dist/BlackEclipse-Setup-*.exe
            Black-Eclipse-site/dist/*.deb
            Black-Eclipse-site/dist/*.dmg
            Black-Eclipse-site/dist/SHA256SUMS.txt
            Black-Eclipse-site/dist/winget/**
            Black-Eclipse-site/dist/packs/*.zip
            Black-Eclipse-site/dist/packs/manifest.json
          if-no-files-found: warn

  release:
    name: publish release
    needs: [build, release-build]
    # Publish whatever platforms succeeded, even if another one failed: a red
    # macOS job must not withhold the Windows and Linux installers. The guard
    # step below still refuses to create an empty release.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # A release with no installers is worse than no release: refuse one.
      - name: Require at least one installer
        run: |
          count=$(find artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) | wc -l)
          echo "installer files: $count"
          test "$count" -gt 0

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # On a dispatch `github.ref_name` is the BRANCH, so the release must be
          # told which tag it belongs to. A tag push resolves to itself.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # A tag push still creates a DRAFT (the signed manifest is deliberately
          # produced offline, never in CI). A dispatch that sets `publish` ships
          # the platforms it built right away, so a Windows-only fast lane can go
          # live in ~15 minutes and the other platforms are attached later.
          draft: ${{ !inputs.publish }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | **Windows 10/11** | [BlackEclipse-Setup.exe](https://github.com/dumbpabloo/BlackEclipse-V1.0/releases/latest/download/BlackEclipse-Setup.exe) |

            This is the same file the README button serves. The versioned
            `BlackEclipse-Setup-<version>*.exe` is an identical copy.

            macOS and Linux builds are not published yet. When one is built on
            request it is attached here as `BlackEclipse-mac-arm64.dmg` /
            `BlackEclipse-linux-amd64.deb`.

            - `BlackEclipse-Setup-<version>-full.exe` — offline Windows edition,
              for a machine with no network.
            - `SHA256SUMS.txt` — verify the Windows installer before running it.

            **Optional components.** The slim installers ship the core only.
            Browser automation, local ML, document reading, desktop control and
            advanced charting are separate archives (`<pack>-<platform>-<arch>.zip`,
            listed under Assets). The app downloads them itself from
            **Settings → Data & Storage → Feature packs**, verifying each against
            the SHA-256 recorded in its build; you never download a pack by hand.
            The `-full` installer already contains every pack.

            **First open.** The build is not code-signed, so Windows asks once:
            SmartScreen → **More info → Run anyway**.

            Your data lives in the platform data directory and survives uninstall.
            MT5 and computer-control are Windows-only.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/SHA256SUMS.txt
            artifacts/**/packs/*.zip
            artifacts/**/packs/manifest.json
            artifacts/**/BlackEclipse-Build-*.zip
