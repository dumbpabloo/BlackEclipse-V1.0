<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Black Eclipse — an open-source agentic harness designed to help you automate finance">
  <title>Black Eclipse social preview</title>
  <!-- Source of truth for the 1280x640 GitHub social preview. Text is real
       <text>, so an export renders it with the local font stack; no external
       references. Export with sharp, do not hand-edit the PNG. -->
  <rect width="1280" height="640" fill="#050607"/>
  <rect x="40" y="40" width="1200" height="560" fill="none" stroke="#f4f5f2" stroke-opacity=".1"/>

  <g transform="translate(96 100)">
    <circle cx="28" cy="28" r="28" fill="#f4f5f2"/>
    <circle cx="42" cy="28" r="26" fill="#050607"/>
  </g>
  <text x="166" y="140" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.6" fill="#f4f5f2">Black Eclipse</text>

  <text x="96" y="272" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#f4f5f2">An open-source agentic</text>
  <text x="96" y="332" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#f4f5f2">harness designed to help</text>
  <text x="96" y="392" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#b4ff42">you automate finance.</text>

  <line x1="96" y1="446" x2="720" y2="446" stroke="#f4f5f2" stroke-opacity=".1"/>

  <text x="96" y="492" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2.9" fill="#8b918d">RESEARCH · ANALYZE · BUILD · AUTOMATE · TRADE</text>

  <text x="1184" y="556" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#8b918d">v0.4.30 · MIT · SELF-HOSTED</text>
</svg>
